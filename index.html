<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>十鍵小鍵盤設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ocean:#82BDCC; --cloud:#F7F7F9; --stone:#9F9992; --sunrise:#F2A65A;
  --bg:#F7F7F9; --card:#FFFFFF; --panel:#F3F3F5; --plate:#9F9992; --plate-edge:#7D7770;
  --cap:#FBFBFC; --cap-edge:#6F6A64; --ink:#1F2B30; --muted:#6B655F; --faint:#A39D96;
  --accent:#82BDCC; --accent-ink:#17323A; --accent-line:#4E95A8; --warn:#A85A14; --ok:#4E95A8;
  --line:#E6E3DF; --flash:#F2A65A; --sun-ink:#3B220B;
  --shadow:0 1px 2px rgba(31,43,48,.04), 0 12px 32px -12px rgba(31,43,48,.12);
  --glow:rgba(130,189,204,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16191C; --card:#1F2327; --panel:#272B30; --plate:#4B4741; --plate-edge:#2A2724;
    --cap:#363A3F; --cap-edge:#141618; --ink:#F7F7F9; --muted:#B9B3AC; --faint:#7E7973;
    --accent:#82BDCC; --accent-ink:#12272D; --accent-line:#82BDCC; --warn:#F2A65A; --ok:#82BDCC;
    --line:#30353A; --flash:#F2A65A; --sun-ink:#3B220B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
    --glow:rgba(130,189,204,.12);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16191C; --card:#1F2327; --panel:#272B30; --plate:#4B4741; --plate-edge:#2A2724;
  --cap:#363A3F; --cap-edge:#141618; --ink:#F7F7F9; --muted:#B9B3AC; --faint:#7E7973;
  --accent:#82BDCC; --accent-ink:#12272D; --accent-line:#82BDCC; --warn:#F2A65A; --ok:#82BDCC;
  --line:#30353A; --flash:#F2A65A; --sun-ink:#3B220B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  --glow:rgba(130,189,204,.12);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);
  background:
    radial-gradient(900px 420px at 85% -120px, var(--glow), transparent 70%),
    radial-gradient(700px 360px at -10% 10%, rgba(242,166,90,.10), transparent 70%),
    var(--bg);
  font-family:"Geist","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}

.wrap{max-width:1120px;margin:0 auto;padding:20px 24px 120px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand-dots{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.brand-dots i{width:9px;height:9px;border-radius:3px;display:block}
.brand-dots i:nth-child(1){background:var(--ocean)}
.brand-dots i:nth-child(2){background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.brand-dots i:nth-child(3){background:var(--stone)}
.brand-dots i:nth-child(4){background:var(--sunrise)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:end;padding:56px 0 28px}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:36px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:5px 12px 5px 8px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sunrise);box-shadow:0 0 0 3px rgba(242,166,90,.2)}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.04;font-weight:700;letter-spacing:-.035em;margin:0 0 16px;max-width:14ch}
.lede{font-size:17px;color:var(--muted);margin:0;max-width:52ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.conn-card{padding:18px}
.conn-card .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:0 0 10px;font-weight:500}
.conn-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:inline-block;margin-right:8px;vertical-align:1px}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--glow)}
.status{font-size:14px;color:var(--muted)}
#connStatus{font-weight:500;color:var(--ink)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:16px 18px}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:500;margin:0 0 6px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:0;font-variant-numeric:tabular-nums}
.stat .v.sm{font-size:19px;letter-spacing:-.02em}
.stat .v[data-state="ok"]{color:var(--ok)}
.stat .v[data-state="dirty"],.stat .v[data-state="never"]{color:var(--warn)}
.meter{height:5px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--ocean);border-radius:3px}
.meter.over i{background:var(--sunrise)}
#meterText{display:block;font-size:12px;margin-top:6px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;
  transition:border-color .15s, background .15s, transform .1s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dark:hover{opacity:.9}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
#writeBtn.primary{background:var(--sunrise);border-color:var(--sunrise);color:var(--sun-ink);padding:10px 20px}
#writeBtn.primary::after{content:" →"}

.notice{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sunrise);padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:14px}
.notice[hidden]{display:none}

/* ---------- main layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.board-card{padding:20px}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 13px;font-size:13px;font-weight:500;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(31,43,48,.12)}
.seg.lang button{padding:6px 11px}

.stage{border-radius:18px;padding:28px 22px;background:
  radial-gradient(120% 90% at 50% 0%, rgba(130,189,204,.35), transparent 70%), var(--panel)}
.plate{position:relative;background:var(--plate);border-radius:18px;padding:16px;
  box-shadow:inset 0 -4px 0 var(--plate-edge), 0 18px 30px -18px rgba(31,43,48,.45)}
.cable{position:absolute;left:50%;width:46px;height:12px;margin-left:-23px;background:var(--plate-edge);border-radius:4px}
.cable.top{top:-6px}.cable.bottom{bottom:-6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cap{position:relative;aspect-ratio:1/1;border:0;border-radius:11px;background:var(--cap);color:var(--ink);
  box-shadow:0 4px 0 var(--cap-edge);padding:9px;text-align:left;display:flex;flex-direction:column;
  justify-content:space-between;transition:transform .08s, box-shadow .08s;overflow:hidden}
.cap.wide{grid-column:span 2;aspect-ratio:auto}
.cap:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cap-edge)}
.cap[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.cap .legend{font-weight:700;font-size:20px;line-height:1.15;letter-spacing:-.02em;word-break:break-word}
.cap .legend.small{font-size:14px;letter-spacing:-.01em}
.cap .sub{font-size:11px;color:var(--muted);line-height:1.3}
.cap.off .legend{color:var(--faint);font-weight:500}
.cap.flash{background:var(--flash);transition:none}

.under{margin-top:18px;display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
label.lbl{font-size:13px;color:var(--muted);min-width:4.5em;font-weight:500}
select,input[type=number],input[type=text],textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
input[type=color]{width:40px;height:36px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
#testInfo{background:var(--panel);border-radius:12px;padding:9px 12px;color:var(--ink)}
#testBtn[aria-pressed="true"]{background:var(--sunrise);border-color:var(--sunrise);color:var(--sun-ink)}

/* ---------- editor ---------- */
.editor{padding:24px}
.editor .eyebrow{margin-bottom:12px}
.editor h2{font-size:30px;letter-spacing:-.03em;line-height:1.1;margin:0 0 6px}
.editor .hint{font-size:13px;color:var(--muted);margin:0 0 18px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin-bottom:22px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
fieldset{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
legend{font-weight:600;padding:0 6px;font-size:14px}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--card);font-weight:500}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--stone) 28%,var(--card));border-color:var(--stone)}
.keys{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:center;margin-bottom:12px;padding:6px;border-radius:12px;background:var(--panel)}
.keytag{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 4px 4px 12px;font-weight:600;font-size:14px}
.keytag button{border:0;background:transparent;color:inherit;opacity:.65;padding:0 6px;font-size:16px;line-height:1}
.keytag button:hover{opacity:1}
.empty{font-size:13px;color:var(--faint);padding:0 6px}
.rec.on{background:var(--sunrise);border-color:var(--sunrise);color:var(--sun-ink)}
details{margin-bottom:14px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:10px;font-weight:500}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.media button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 10px;font-size:14px;font-weight:500;text-align:left}
.media button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-line)}
textarea{width:100%;min-height:96px;resize:vertical}
.warn{color:var(--warn);font-size:13px}

.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:500;margin-bottom:12px;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{flex:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .track{background:var(--ocean)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent-line);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.switch .track,.switch .track::after{transition:none}}

.test-warn{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:11px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--sunrise) 24%,var(--card));border:1.5px solid var(--sunrise);font-size:14px;font-weight:500;color:var(--ink)}
.test-warn[hidden]{display:none}
.test-warn svg{flex:none;width:20px;height:20px;color:var(--sun-ink)}
.test-warn span{flex:1;min-width:12em}
.test-warn .btn{padding:7px 14px;font-size:13px}
.test-warn.nudge{animation:nudge .35s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){.test-warn.nudge{animation:none}}

/* ---------- templates ---------- */
.templates{margin-bottom:24px}
.tpl-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;margin-bottom:14px}
.tpl-head h2{font-size:24px;letter-spacing:-.03em;margin:0;line-height:1.2}
.tpl-head p{margin:0;color:var(--muted);font-size:14px}
.tpl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.tpl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tpl{font:inherit;color:var(--ink);padding:14px;text-align:left;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s, transform .1s, box-shadow .15s}
.tpl:hover{border-color:var(--faint)}
.tpl:active{transform:translateY(1px)}
.tpl[aria-pressed="true"]{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--glow), var(--shadow)}
.tpl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px}
.tpl{background:color-mix(in srgb,var(--ocean) 13%,var(--card));border-color:color-mix(in srgb,var(--ocean) 30%,var(--line))}
.tpl-title{display:flex;align-items:center;gap:10px;min-width:0}
.tpl-icon{flex:none;width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 2px rgba(31,43,48,.08), inset 0 0 0 1px var(--line)}
.tpl-icon svg{width:22px;height:22px;display:block}
.mini-wrap{position:relative;display:block;margin-top:auto}
.in-use{position:absolute;inset:0;display:grid;place-items:start end;padding:6px;border-radius:10px;
  background:color-mix(in srgb,var(--card) 18%,transparent);
  -webkit-backdrop-filter:blur(1.2px);backdrop-filter:blur(1.2px);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--card) 60%,transparent);
  animation:inUse .18s ease-out}
.in-use .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px 4px 8px;opacity:.7;
  box-shadow:0 3px 10px -4px rgba(31,43,48,.35)}
.in-use .badge svg{width:12px;height:12px}
.tpl{position:relative}
.tpl-top{padding-right:86px}
.tpl .tpl-badge{position:absolute;top:21px;right:14px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:5px 11px 5px 9px;background:var(--sunrise);color:var(--sun-ink);
  box-shadow:0 4px 12px -4px rgba(217,130,47,.65);animation:inUse .18s ease-out}
.tpl-badge svg{width:12px;height:12px}
@media (prefers-reduced-motion: reduce){.tpl-badge{animation:none}}
@keyframes inUse{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.in-use{animation:none}}
.tpl-name{font-weight:700;letter-spacing:-.01em;font-size:15px;line-height:1.25}
.badge{flex:none;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--plate);padding:6px;border-radius:10px}
.mk{background:var(--cap);border-radius:5px;font-size:12px;font-weight:700;text-align:center;padding:6px 0;line-height:1;color:var(--ink);box-shadow:0 1px 0 var(--cap-edge)}
.mk.w{grid-column:span 2}
.tpl-undo{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:12px 0 0;font-size:14px;color:var(--muted)}
.tpl-undo[hidden]{display:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:13px;color:var(--muted)}
.meta-mem{display:inline-flex;align-items:center;gap:8px}
.meta .meter{width:90px;margin:0}
.meta #meterText{display:inline;margin:0;font-size:13px}

.cap .num{position:absolute;top:7px;right:10px;font-size:11px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.cap.flash .num{color:var(--sun-ink)}
.top-right{display:flex;align-items:center;gap:10px}
.guide-btn{display:inline-flex;align-items:center;gap:7px;position:relative}
.guide-btn svg{width:17px;height:17px}
.guide-btn.new::after{content:"";position:absolute;top:3px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--sunrise);box-shadow:0 0 0 2px var(--card)}
#guide{max-width:min(880px,calc(100% - 24px));width:100%;padding:0;max-height:calc(100vh - 48px);flex-direction:column}
#guide[open]{display:flex}
.g-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 12px}
.g-head h3{margin:0;font-size:24px;letter-spacing:-.02em}
.g-x{border:0;background:var(--panel);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink)}
.g-nav{margin:0 24px 8px;flex-wrap:wrap;align-self:flex-start}
.g-body{overflow:auto;padding:8px 24px 28px}
#guide .g-body p{color:var(--ink);font-size:15px;margin:10px 0}
.g-body h4{font-size:17px;margin:24px 0 8px;letter-spacing:-.01em}
.g-img{display:block;max-width:100%;border-radius:14px;border:1px solid var(--line);margin:10px 0;background:#fff}
.g-img.wide{width:100%}
.g-game{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.g-game{grid-template-columns:1fr}}
.g-game .g-img{max-width:200px;margin-top:0}
.g-tbl{overflow-x:auto;margin:10px 0}
.g-tbl table{border-collapse:collapse;width:100%;font-size:14px}
.g-tbl th,.g-tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.g-tbl th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
#guide .g-note{background:color-mix(in srgb,var(--sunrise) 16%,var(--card));border-radius:12px;padding:10px 12px}
.g-games{flex-wrap:wrap;margin-bottom:6px}
.g-steps{list-style:none;padding:0;margin:12px 0;display:grid;gap:10px;counter-reset:gs}
.g-steps li{counter-increment:gs;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.g-steps li::before{content:counter(gs);width:30px;height:30px;border-radius:50%;background:var(--sunrise);color:var(--sun-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.g-steps b{font-size:15px}
#guide .g-steps p{margin:4px 0 8px;color:var(--muted)}
.g-show{border:0;background:none;color:var(--accent-line);font-weight:600;padding:0;font-size:14px}
.g-show:hover{text-decoration:underline}
.spotlight{position:relative;z-index:15;outline:3px solid var(--sunrise)!important;outline-offset:5px;border-radius:12px;animation:spot 1.2s ease-in-out 3}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(242,166,90,.55)}50%{box-shadow:0 0 0 14px rgba(242,166,90,0)}}
@media (prefers-reduced-motion: reduce){.spotlight{animation:none}}
/* ---------- floating action bar ---------- */
.actions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
  width:min(1072px,calc(100% - 24px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:8px 8px 8px 12px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.actions .grow{flex:1}
.saved{font-size:13px;color:var(--muted)}
.saved.dirty{color:var(--warn)}
@media (max-width:600px){.actions{border-radius:22px}.saved{width:100%;order:-1;padding:2px 4px}}

.logbox{margin-top:22px;padding:14px 18px}
.logbox summary{cursor:pointer;font-weight:500;color:var(--muted);font-size:14px}
.logbox[open] summary{margin-bottom:12px}
#log{max-height:260px;overflow:auto;background:var(--panel);border-radius:12px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:24px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(22,25,28,.35);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}
dialog p{font-size:14px;color:var(--muted);margin:0 0 14px}
dialog textarea{min-height:180px;font-size:13px}
dialog .row{justify-content:flex-end;margin-top:14px}
code{background:var(--panel);padding:1px 6px;border-radius:6px;font-size:13px}

#kbd{max-width:min(1060px,calc(100% - 24px));width:auto}
.kb-scroll{overflow-x:auto;padding:4px 2px 8px}
.kb{--u:40px;display:flex;gap:calc(var(--u) * .4);width:max-content;background:var(--plate);padding:14px;border-radius:16px;box-shadow:inset 0 -3px 0 var(--plate-edge)}
.kb-block{display:grid;grid-template-rows:repeat(7,var(--u))}
.kb-key{margin:2px;border:0;border-radius:7px;background:var(--cap);box-shadow:0 2px 0 var(--cap-edge);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:0 2px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
.kb-key .t{font-size:10px;color:var(--muted);font-weight:500}
.kb-key[data-bit]{background:color-mix(in srgb,var(--stone) 30%,var(--cap))}
.kb-num .kb-key{background:color-mix(in srgb,var(--ocean) 32%,var(--cap))}
.kb-key:hover{filter:brightness(.95)}
.kb-key[aria-pressed="true"]{background:var(--sunrise);color:var(--sun-ink);box-shadow:0 2px 0 #B8741F}
.kb-key[aria-pressed="true"] .t{color:inherit}
.kb-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;font-size:14px}
.kb-foot .grow{flex:1}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.cap,.toast,.btn{transition:none}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>NHHW</div>
    <div class="top-right">
      <button class="btn guide-btn" id="guideBtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5c2.2-1 4.6-1 7 .6v11c-2.4-1.6-4.8-1.6-7-.6z"/><path d="M17 4.5c-2.2-1-4.6-1-7 .6v11c2.4-1.6 4.8-1.6 7-.6z"/></svg><span data-t="guideBtn"></span></button>
    <div class="seg lang" role="group" aria-label="Language / 語言 / Idioma">
        <button data-lang="zh">中文</button>
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 data-t="title"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="card conn-card">
      <p class="label" data-t="statConn"></p>
      <div class="conn-line">
        <span id="connStatus"></span>
        <button class="btn dark" id="connectBtn" data-t="connect"></button>
      </div>
    </div>
  </section>

  <section class="templates" aria-labelledby="tplTitle">
    <div class="tpl-head">
      <h2 id="tplTitle" data-t="tplTitle"></h2>
      <p data-t="tplHint"></p>
    </div>
    <div class="tpl-grid" id="tplGrid"></div>
    <p class="tpl-undo" id="tplUndo" hidden><span id="tplUndoText"></span><button class="btn" id="tplUndoBtn" data-t="undo"></button></p>
  </section>

  <div class="notice" id="notice" hidden></div>

  <div class="layout">
    <section class="card board-card" id="boardSec">
      <div class="board-head">
        <div class="seg" role="group" id="oriGroup">
          <button data-ori="top" data-t="bigTop"></button>
          <button data-ori="bottom" data-t="bigBottom"></button>
        </div>
        <button class="btn" id="testBtn" aria-pressed="false"></button>
      </div>
      <div class="stage">
        <div class="plate">
          <div class="cable" id="cable"></div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
      <div class="under">
        <p class="status" id="testInfo" hidden style="margin:0"></p>
        <div class="test-warn" id="testWarn" role="alert" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18.5 17h-17z" fill="currentColor"/><path d="M10 8v4.2M10 14.6v.1" stroke="var(--sunrise)" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span id="testWarnText"></span>
          <button class="btn dark" id="testWarnBtn"></button>
        </div>
        <div class="meta">
          <span id="statSet"></span>
          <span class="meta-mem"><span data-t="space"></span> <span id="meterText"></span><span class="meter" id="meter"><i></i></span></span>
        </div>
        <div class="row">
          <label class="lbl" for="lightMode" data-t="light"></label>
          <select id="lightMode"></select>
          <input type="color" id="lightColor">
        </div>
      </div>
    </section>

    <section class="card editor" id="editor" aria-live="polite"></section>
  </div>

  <details class="card logbox"><summary data-t="log"></summary>
    <div class="row" style="margin-bottom:10px"><button class="btn" id="logCopy" data-t="copyLog"></button></div>
    <pre id="log"></pre>
  </details>
</div>

<div class="actions">
  <button class="btn" id="exportBtn" data-t="export"></button>
  <button class="btn" id="importBtn" data-t="import"></button>
  <span class="grow"></span>
  <span class="saved" id="savedText"></span>
  <button class="btn primary" id="writeBtn" disabled data-t="write"></button>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <p id="dlgText"></p>
  <textarea id="dlgArea" spellcheck="false"></textarea>
  <div class="row">
    <button class="btn" id="dlgCancel" data-t="close"></button>
    <button class="btn dark" id="dlgOk"></button>
  </div>
</dialog>
<dialog id="kbd" aria-labelledby="kbTitle">
  <h3 id="kbTitle"></h3>
  <p data-t="kbHint"></p>
  <div class="kb-scroll"><div class="kb" id="kbWrap"></div></div>
  <div class="kb-foot">
    <span><span data-t="current"></span><b id="kbPreview"></b></span>
    <span class="grow"></span>
    <button class="btn" id="kbClear" data-t="clearAll"></button>
    <button class="btn" id="kbCancel" data-t="cancel"></button>
    <button class="btn dark" id="kbDone" data-t="done"></button>
  </div>
</dialog>
<dialog id="guide" aria-labelledby="guideTitle">
  <div class="g-head"><h3 id="guideTitle"></h3><button class="g-x" id="guideClose">×</button></div>
  <div class="seg g-nav" id="guideNav" role="group"></div>
  <div class="g-body" id="guideBody"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

  }
  if (testMode) {

function send(bytes) {
  log('→ ' + hex(bytes));
  return new Promise((resolve, reject) => {
    const tm = setTimeout(() => { dev.oninputreport = null; log(t('logNoReply')); reject(new Error(t('noReply'))); }, 3000);
    dev.oninputreport = e => {

async function connect() {
  if (!('hid' in navigator)) return showNotice('noHid');
  try {
    let devs = (await navigator.hid.getDevices()).filter(d => d.vendorId === VID && d.productId === PID);
    let d = devs.find(x => x.collections.some(c => c.usagePage === 0xFF00));
    if (!d) {
      devs = await navigator.hid.requestDevice({ filters: [{ vendorId: VID, productId: PID }] });
      d = devs.find(x => x.collections.some(c => c.usagePage === 0xFF00));
    }
    if (!d) return showNotice('noIface');
    if (!d.opened) await d.open();
    dev = d;
    log(t('device', d.productName || t('noName'), d.collections.map(c => '0x' + c.usagePage.toString(16)).join(', ')));
    const info = await send([0xAF, 0x01]);
    const a = info[2], b = info[3];
    if (a !== EXPECT.tagA || b !== EXPECT.tagB) {
      devOk = false;
      setConn('mismatch', [a, b], false);
      showNotice('mismatchNote', a, b);
    } else {
      devOk = true; showNotice(null);
      setConn('connected', [], true);
    }
  } catch (err) {
    devOk = false;
    if (err && (err.name === 'SecurityError' || err.name === 'NotAllowedError')) showNotice('noHidPolicy');
    else if (err && err.name === 'NotFoundError') showNotice(null);
    else showNotice('connFail', (err && err.message) || err);
  }
  updateStatus();
}

function fromOriginal(list) {

  return list.map(s => {
    if (s.type == 1) return { kind: 'key', down: conv(s.downKeys), up: conv(s.upKeys) };
    if (s.type == 2) { const n = (s.downKeys[0] || {}).num || 0; return { kind: 'media', usage: ((n & 0xFF) << 8) | (n >> 8) }; }

    }
    return { kind: 'off' };

}

      return `<span class="mk${row.length === 2 ? ' w' : ''}">${c === 'E' ? '↵' : esc(c)}</span>`;
    }).join('')).join('');
    b.innerHTML = `<span class="tpl-top"><span class="tpl-title"><span class="tpl-icon" style="color:${ICONS[tp.id].c}">${ICONS[tp.id].svg}</span><span class="tpl-name">${esc(tp.name)}</span></span></span><span class="mini-wrap"><span class="mini" aria-hidden="true">${mini}</span>${tp.id === act ? `<span class="in-use"></span>` : ''}</span>${tp.id === act ? `<span class="badge tpl-badge"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>${esc(t('tplActive'))}</span>` : ''}`;
    b.onclick = () => applyTemplate(tp);
    gridEl.appendChild(b);
  });
  const u = document.getElementById('tplUndo');
  u.hidden = !undoState;
  if (undoState) document.getElementById('tplUndoText').textContent = t('tplApplied', lastApplied);
}
function applyTemplate(tp) {
  if (activeTemplate() === tp.id) return;
  undoState = JSON.stringify({ keys: state.keys, template: state.template });
  lastApplied = tp.name;
  state.keys = tplKeys(tp); state.template = tp.id;
  selected = 0; modOpen = { down: false, up: false }; stopRecording();
  save(); renderAll();
}
document.getElementById('tplUndoBtn').onclick = () => {
  if (!undoState) return;
  const o = JSON.parse(undoState);
  state.keys = o.keys; state.template = o.template; undoState = null;
  save(); renderAll();
};

const guideDlg = document.getElementById('guide');
let guideTab = 0, guideGame = null;
const gtbl = (head, rows) => `<div class="g-tbl"><table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const gsteps = (steps, g) => `<ol class="g-steps">${steps.map(([h, p, sel]) => `<li><div><b>${esc(h)}</b><p>${esc(p)}</p><button class="g-show" data-target="${esc(sel)}">${esc(g.showMe)} →</button></div></li>`).join('')}</ol>`;
function renderGuide() {
  const g = GUIDE[lang];
  document.getElementById('guideTitle').textContent = g.title;
  document.getElementById('guideClose').setAttribute('aria-label', g.close);
  document.getElementById('guideNav').innerHTML = g.nav.map((n, i) => `<button data-gtab="${i}" aria-pressed="${i === guideTab}">${esc(n)}</button>`).join('');
  if (!guideGame) guideGame = activeTemplate() || 'dice';
  let h = '';
  if (guideTab === 0) {
    h = `<p>${esc(g.installIntro)}</p><img class="g-img wide" src="${GIMG.overview}" alt="">
      ${gtbl(g.stemHead, g.stemRows)}<p>${esc(g.capIntro)}</p>${gtbl(g.capHead, g.capRows)}
      <h4>${esc(g.pickGame)}</h4>
      <div class="seg g-games" role="group">${TEMPLATES.map(tp => `<button data-ggame="${tp.id}" aria-pressed="${tp.id === guideGame}">${esc(tp.name)}</button>`).join('')}</div>
      <p class="g-note">${esc(g.gameNote)}</p>
      <div class="g-game"><img class="g-img" src="${GIMG[guideGame]}" alt="">${gtbl(g.gameHead, g.games[guideGame])}</div>`;
  } else if (guideTab === 1) {
    h = `<p>${esc(g.setupIntro)}</p>${gsteps(g.steps, g)}`;
  } else if (guideTab === 2) {
    h = `<h4>${esc(g.testA)}</h4>${gsteps(g.testASteps, g)}<h4>${esc(g.testB)}</h4><p>${esc(g.testBIntro)}</p>${gtbl(g.testHead, g.testRows)}<p class="g-note">${esc(g.testNote)}</p>`;
  } else {
    h = gtbl(g.faqHead, g.faq);
  }
  const body = document.getElementById('guideBody');
  body.innerHTML = h;
  document.querySelectorAll('[data-gtab]').forEach(b => b.onclick = () => { guideTab = +b.dataset.gtab; renderGuide(); body.scrollTop = 0; });
  body.querySelectorAll('[data-ggame]').forEach(b => b.onclick = () => { guideGame = b.dataset.ggame; renderGuide(); });
  body.querySelectorAll('.g-show').forEach(b => b.onclick = () => spotlight(b.dataset.target));
}
function spotlight(sel) {
  const el = document.querySelector(sel);
  guideDlg.close();
  if (!el) return;
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
  el.classList.remove('spotlight'); void el.offsetWidth; el.classList.add('spotlight');
  setTimeout(() => el.classList.remove('spotlight'), 3600);
}
document.getElementById('guideBtn').onclick = () => {
  guideGame = activeTemplate() || guideGame || 'dice';
  renderGuide(); guideDlg.showModal();
  try { localStorage.setItem('xfp10-guide-seen', '1'); } catch (e) {}
  document.getElementById('guideBtn').classList.remove('new');
};
document.getElementById('guideClose').onclick = () => guideDlg.close();
try { if (!localStorage.getItem('xfp10-guide-seen')) document.getElementById('guideBtn').classList.add('new'); } catch (e) {}

/* ---------- misc ---------- */
let toastT;
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200);
}
if (!('hid' in navigator)) notice = { k: 'noHid', args: [] };
else if (document.featurePolicy && document.featurePolicy.allowsFeature && !document.featurePolicy.allowsFeature('hid')) notice = { k: 'noHidPolicy', args: [] };

applyLang();
})();
</script>
